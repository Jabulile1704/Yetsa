# Deliberately modest. A style gate should catch the things that make a
# codebase inconsistent, not relitigate decisions already made on purpose.

included:
  - Yetsa
  - YetsaTests

excluded:
  - build
  - build-device
  - Tools

disabled_rules:
  # SwiftUI view bodies are legitimately long and deeply nested; splitting them
  # to satisfy a counter makes them harder to read, not easier.
  - type_body_length
  - function_body_length
  - closure_body_length
  - cyclomatic_complexity
  - nesting
  # Trailing commas in multi-line literals are a matter of taste.
  - trailing_comma

opt_in_rules:
  - empty_count
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length: 2
  excluded: [i, j, x, y, z, id, to, at, on, up]

type_name:
  min_length: 3

large_tuple:
  warning: 3
