name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain this runner has
        run: |
          xcodebuild -version
          echo "--- installed Xcodes ---"
          ls /Applications | grep -i '^Xcode' || true
          echo "--- simulator runtimes ---"
          xcrun simctl list runtimes | grep -i ios || true

      # Yetsa targets iOS 26.1 and uses AlarmKit and CLMonitor. If the runner's
      # Xcode is older than the project needs, this step is where it will say
      # so plainly rather than failing somewhere confusing.
      - name: Pick the newest Xcode on the runner
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            echo "using $NEWEST"
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi
          xcodebuild -version

      # Runner images carry different simulator sets, so the device is
      # resolved at runtime rather than named and hoped for.
      - name: Choose a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in sorted(runtimes.items()):
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      best = (device['udid'], device['name'], runtime)
          if not best:
              sys.exit('no iPhone simulator on this runner')
          print(best[0])
          sys.stderr.write('using %s on %s\\n' % (best[1], best[2]))
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Yetsa.xcodeproj \
            -scheme Yetsa \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Keep the result bundle when something goes wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      # Warnings are reported but do not fail the job; only error-severity
      # rules do. The thresholds in .swiftlint.yml are set so that a gate
      # failing means something genuinely went wrong, not that a line grew.
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging
